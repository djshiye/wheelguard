name: Wheelguard CI

# Every push and pull request builds and tests one noarch RPM on the oldest
# supported Fedora. It installs under /usr/share/wheelguard and runs on any
# Python 3, so the same package serves every Fedora release.
# Pushes to main also sign it, commit the signed DNF repository to the
# gh-pages branch (served by GitHub Pages) and install it from there in clean
# Fedora 44 and 45 containers.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: every job can only read the repository unless it asks for more (only publish
# writes, to gh-pages). Third-party code is pinned to exact commits; Dependabot proposes updates.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP: wheelguard
  SITE_URL: https://djshiye.github.io/wheelguard

jobs:
  build:
    name: Build and test RPM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: fedora:44
    outputs:
      evr: ${{ steps.rpm.outputs.evr }}
    steps:
      # git first: without it checkout downloads a tarball and the commit
      # count used for the RPM release number is unavailable.
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          dnf install -y rpm-build rpmdevtools rpmlint python3 python3-evdev python3-pyside6 \
            desktop-file-utils appstream systemd-rpm-macros tar gnupg2 ruff qt6-qtdeclarative-devel

      # The only step that sees the signing secret, before any project code
      # runs: it exports the public half for the package and forgets the rest.
      - name: Public signing key
        env:
          RPM_SIGNING_KEY: ${{ secrets.RPM_SIGNING_KEY }}
        run: |
          rpmdev-setuptree
          export GNUPGHOME=$(mktemp -d)
          if [ -n "$RPM_SIGNING_KEY" ]; then
            printf '%s\n' "$RPM_SIGNING_KEY" | gpg --batch --quiet --import
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # Pull requests from forks get no secrets: build with a throwaway key.
            gpg --batch --passphrase '' --quick-gen-key 'Throwaway CI key' rsa2048 sign 1d
          else
            echo "::error::The RPM_SIGNING_KEY secret is not set for this repository."
            exit 1
          fi
          gpg --batch --armor --export-options export-minimal --export > ~/rpmbuild/SOURCES/RPM-GPG-KEY-djshiye
          gpgconf --kill all
          rm -rf "$GNUPGHOME"

      # ---- Tests ----
      - name: Syntax check
        run: python3 -m compileall -q wheelguard tests tools

      # Fast static checks: Python (ruff.toml) and QML. qmllint's "unqualified" check is off because
      # the pages deliberately reach outer ids from delegates; any other warning fails the build.
      - name: Lint
        run: |
          ruff check wheelguard tests tools
          cd wheelguard/gui/qml
          out=$(/usr/lib64/qt6/bin/qmllint --unqualified disable -I . Main.qml $(ls Wg/*.qml | grep -v Theme.qml) 2>&1)
          echo "$out"
          if echo "$out" | grep -q '^Warning'; then
            echo "::error::qmllint found problems in the QML files."
            exit 1
          fi

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s tests -t . -v

      # Load the real window on every page from the mock mouse and daemon: catches QML errors that
      # only show up at run time (a typo in a binding, a missing component).
      - name: Render every page
        env:
          QT_QPA_PLATFORM: offscreen
          WHEELGUARD_HW_MOCK: connected
          WHEELGUARD_GSETTINGS_READONLY: "1"
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d) HOME=$(mktemp -d)
          python3 tools/mock_daemon.py --scenario connected --socket "$XDG_RUNTIME_DIR/mock.sock" &
          mock=$!
          trap 'kill "$mock"' EXIT
          sleep 1
          for page in scroll mouse pointer profiles about; do
            for scale in 1 1.5; do
              timeout 60 python3 wheelguard-settings --socket "$XDG_RUNTIME_DIR/mock.sock" --page "$page" --text-scale "$scale" \
                --screenshot "$RUNNER_TEMP/$page-$scale.png" --delay-ms 2000 > "$RUNNER_TEMP/log" 2>&1 || { cat "$RUNNER_TEMP/log"; exit 1; }
              if grep -E '\.qml:[0-9]+' "$RUNNER_TEMP/log"; then
                echo "::error::QML errors on the $page page (text size $scale)"
                exit 1
              fi
            done
          done

      - name: Build RPM
        id: rpm
        run: |
          VERSION=$(sed -n 's/^Version: *//p' build-aux/wheelguard.spec)
          git config --global --add safe.directory "$PWD"
          BUILD=$(git rev-list --count HEAD)
          git archive --format=tar.gz --prefix="wheelguard-${VERSION}/" \
            -o ~/rpmbuild/SOURCES/wheelguard-${VERSION}.tar.gz HEAD
          rpmbuild -ba --define "release_suffix .$BUILD" build-aux/wheelguard.spec
          rpmlint build-aux/wheelguard.spec ~/rpmbuild/RPMS/noarch/wheelguard-*.rpm || true
          mkdir -p out
          cp ~/rpmbuild/RPMS/noarch/wheelguard-*.rpm ~/rpmbuild/SRPMS/wheelguard-*.src.rpm out/
          echo "evr=$(rpm -qp --qf '%{VERSION}-%{RELEASE}' ~/rpmbuild/RPMS/noarch/wheelguard-*.noarch.rpm)" >> "$GITHUB_OUTPUT"

      - name: No Python version pinned
        run: |
          rpm -qp --requires out/*.noarch.rpm
          if rpm -qp --requires out/*.noarch.rpm | grep -E '^python\(abi\)|python3\.[0-9]+'; then
            echo "::error::The package pins a Python version; it must run on any Fedora."
            exit 1
          fi

      - name: Upload RPMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wheelguard-rpms
          path: out/*.rpm
          if-no-files-found: error

  # The package runs on every Fedora's own Python; also run the tests on the newest one.
  test-newest:
    name: Unit tests on Fedora 45
    runs-on: ubuntu-latest
    container:
      image: fedora:45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install test dependencies
        run: dnf install -y python3 python3-evdev python3-pyside6
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s tests -t .

  publish:
    name: Sign and publish repository
    needs: [build, test-newest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    permissions:
      contents: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Install tools
        run: dnf install -y git rpm-sign createrepo_c python3-rpm gnupg2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The published repository; its rpm/ holds the builds to keep.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: gh-pages
          path: pages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: wheelguard-rpms
          path: new
      - name: Sign packages and build the repository
        env:
          RPM_SIGNING_KEY: ${{ secrets.RPM_SIGNING_KEY }}
        run: |
          printf '%s\n' "$RPM_SIGNING_KEY" | gpg --batch --quiet --import
          FPR=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr/ {print $10; exit}')
          gpg --batch --armor --export-options export-minimal --export "$FPR" > "$RUNNER_TEMP/key.asc"
          rpmsign --define "_gpg_name $FPR" --addsign new/*.rpm
          python3 build-aux/dnf-repo.py --app "$APP" --url "$SITE_URL" --title Wheelguard \
            --summary "Scroll bounce filter and mouse settings (Endgame Gear, Logitech, Razer)" \
            --icon build-aux/io.github.djshiye.Wheelguard.svg \
            --new new --site site --prev pages/rpm \
            --repo-file build-aux/wheelguard.repo --key "$RUNNER_TEMP/key.asc"
          gpgconf --kill all
          echo "### Signed with key \`$FPR\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit to gh-pages
        run: |
          cd pages
          git config user.name "Dino Klisura"
          git config user.email "115914552+djshiye@users.noreply.github.com"
          git rm -rq --ignore-unmatch .
          cp -a ../site/. .
          git add -A
          git commit -q -m "Publish $APP-${{ needs.build.outputs.evr }}"
          git push origin HEAD:gh-pages

  # A clean container adds the repository from its URL (or still has the old
  # per-Fedora .repo file), installs with signature checks on, and runs the app.
  verify:
    name: Install on Fedora ${{ matrix.fedora }} (${{ matrix.setup }} repo file)
    needs: [build, publish]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora: [44, 45]
        setup: [new, legacy]
    container:
      image: fedora:${{ matrix.fedora }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: build-aux/verify-install.sh
          sparse-checkout-cone-mode: false
      - name: Install from the published repository
        run: |
          sh build-aux/verify-install.sh "${{ matrix.setup }}" "$APP" "$SITE_URL" \
            "${{ needs.build.outputs.evr }}" "$SITE_URL/fedora-\$releasever/"
      - name: Smoke test
        run: |
          export QT_QPA_PLATFORM=offscreen
          /usr/bin/python3 -sP -c 'import sys; sys.path.insert(0, "/usr/share/wheelguard"); import wheelguard.core, wheelguard.daemon, wheelguard.gui.app, wheelguard.gui.backend; print(wheelguard.__version__)'
          head -n1 /usr/bin/wheelguard-settings | grep -qx '#!/usr/bin/python3 -sP'
